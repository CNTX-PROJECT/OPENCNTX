[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencntx"
version = "0.3.0"
description = "Create small, explicit, verifiable context packages for one AI task."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OPENCNTX contributors" }]
keywords = ["ai", "cli", "context-management", "local-first", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/CNTX-PROJECT/OPENCNTX"
Source = "https://github.com/CNTX-PROJECT/OPENCNTX"
Issues = "https://github.com/CNTX-PROJECT/OPENCNTX/issues"
Changelog = "https://github.com/CNTX-PROJECT/OPENCNTX/blob/main/CHANGELOG.md"
Security = "https://github.com/CNTX-PROJECT/OPENCNTX/security/policy"
Documentation = "https://github.com/CNTX-PROJECT/OPENCNTX/tree/main/docs"

[project.scripts]
opencntx = "opencntx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencntx = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/opencntx/cli_tasks.py" = ["PLR0911"] # A closed CLI dispatcher has eight terminal routes.
"src/opencntx/cli_workspace.py" = ["S101"] # Assert narrows an internal optional dispatch result.
"src/opencntx/primitives.py" = ["TRY004"] # Preserve the established ValueError contract.
"tests/*.py" = ["S101", "S603"] # Tests use assertions and only fixed local executables.

[tool.mypy]
check_untyped_defs = true
follow_imports = "skip"
python_version = "3.11"

[tool.coverage.run]
branch = true
source = ["opencntx"]

[tool.coverage.report]
fail_under = 75
show_missing = true
