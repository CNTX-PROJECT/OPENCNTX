[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencntx"
version = "1.3.0"
description = "Create small, explicit, verifiable context packages for one AI task."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OPENCNTX contributors" }]
keywords = ["ai", "cli", "context-management", "local-first", "verification"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/CNTX-PROJECT/OPENCNTX"
Source = "https://github.com/CNTX-PROJECT/OPENCNTX"
Issues = "https://github.com/CNTX-PROJECT/OPENCNTX/issues"
Changelog = "https://github.com/CNTX-PROJECT/OPENCNTX/blob/main/CHANGELOG.md"
Security = "https://github.com/CNTX-PROJECT/OPENCNTX/security/policy"
Documentation = "https://github.com/CNTX-PROJECT/OPENCNTX/tree/main/docs"

[project.scripts]
opencntx = "opencntx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencntx = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/opencntx/cli_tasks.py" = ["PLR0911"] # A closed CLI dispatcher has eight terminal routes.
"src/opencntx/cli_workspace.py" = ["S101"] # Assert narrows an internal optional dispatch result.
"src/opencntx/adaptive_storage.py" = ["S608"] # Bound question-mark placeholders keep record values parameterized.
"src/opencntx/continuity.py" = ["S603"] # Read-only Git adapters execute only the discovered Git binary with bounded arguments.
"src/opencntx/continuity_sync.py" = ["S603"] # Private sync executes only bounded Git commands and never invokes a shell.
"src/opencntx/layout_plan.py" = ["S603"] # Planning executes only fixed read-only Git identity queries.
"src/opencntx/integrity.py" = ["BLE001"] # Transaction rollback must cover every process-termination exception class.
"src/opencntx/primitives.py" = ["TRY004"] # Preserve the established ValueError contract.
"tests/*.py" = ["S101", "S603"] # Tests use assertions and only fixed local executables.
"tests/test_integrity.py" = ["BLE001", "S101", "S603"] # The subprocess recorder must report every child failure class.
"tests/test_lifecycle.py" = ["BLE001", "S101", "S603"] # The subprocess recorder must report every child failure class.
"tools/quality_gate.py" = ["S603"] # Runs only the current Python and fixed repository commands.
"tools/r8_hardening.py" = ["BLE001", "E402", "S310", "S603"] # A child reports every failure class; the fixed bootstrap, HTTPS URL, and local executables are trusted.
"tools/release_artifacts.py" = ["S603"] # Runs only controlled local build and install commands.
"tools/release_version_gate.py" = ["S603"] # Runs only the discovered Git binary with closed read-only arguments.
"tools/render_brand.py" = ["S314"] # Parses only SVG bytes generated inside this repository.

[tool.mypy]
check_untyped_defs = true
follow_imports = "skip"
python_version = "3.11"

[tool.coverage.run]
branch = true
source = ["opencntx"]

[tool.coverage.report]
fail_under = 78
show_missing = true
