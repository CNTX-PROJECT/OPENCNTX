name: Report a bug
description: Report one reproducible problem without sensitive content.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never share passwords, tokens, personal data, private source code, or sensitive context. Report a possible vulnerability only through **Report a vulnerability** under Security.
  - type: input
    id: version
    attributes:
      label: OPENCNTX version
      description: For example v1.8.5 or a commit SHA.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Ubuntu or another Linux distribution
        - macOS
        - Another platform
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe example and exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, and non-public project content.
          required: true
        - label: This is not a vulnerability report.
          required: true
