name: Restore original visual documentation

on:
  push:
    branches:
      - fix/restore-original-design-20260918

permissions:
  contents: read

jobs:
  restore:
    if: github.repository == 'CNTX-PROJECT/OPENCNTX' && contains(github.event.head_commit.message, '[restore-original-design]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Restore original layout while retaining the existing page-length limit
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        shell: python {0}
        run: |
          import subprocess
          import textwrap
          source = subprocess.check_output(['git', 'show', '2deed47ffd7008ecde10bb6041e504698f44361c:.github/workflows/restore-original-design.yml']).decode('utf-8')
          script = textwrap.dedent(source.split('        run: |\n', 1)[1])
          old = "or git('rev-parse', 'HEAD^') != CURRENT"
          assert old in script
          script = script.replace(old, "or git('merge-base', CURRENT, HEAD) != CURRENT")
          old = "marker + '\\nVersion"
          assert old in script
          script = script.replace(old, "marker.rstrip('\\n') + ' Version")
          old = "                  injected += '        self.assertIn(' + repr(block) + ', text)\\n'"
          # Preserve exact strings without oversized physical Python source lines.
          target = "        injected += '        self.assertIn(' + repr(block) + ', text)\\n'"
          assert target in script
          replacement = (
              "        injected += '        self.assertIn(\\n'\n"
              "        for offset in range(0, len(block), 50):\n"
              "            injected += '            ' + repr(block[offset:offset + 50]) + '\\n'\n"
              "        injected = injected.rstrip('\\n') + ',\\n            text,\\n        )\\n'"
          )
          script = script.replace(target, replacement)
          exec(compile(script, '<exact-original-design-restoration>', 'exec'))
