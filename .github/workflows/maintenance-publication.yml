name: Publication maintenance
on:
  push:
    branches: [maintenance/github-cleanup-20260918]
permissions:
  contents: read
concurrency:
  group: opencntx-publication-maintenance
  cancel-in-progress: false
jobs:
  preserve:
    if: contains(github.event.head_commit.message, '[preserve-publication]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Preserve repository and exact release assets without deleting anything
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/preserve_publication.py
      - uses: actions/upload-artifact@v4
        with:
          name: opencntx-before-cleanup
          path: ${{ runner.temp }}/opencntx-preserved/*
          retention-days: 90
          if-no-files-found: error
