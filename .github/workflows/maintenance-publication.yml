name: Publication maintenance
on:
  push:
    branches: [maintenance/github-cleanup-20260918]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read workflow validation message
        shell: python {0}
        run: |
          import re, urllib.request
          url='https://github.com/CNTX-PROJECT/OPENCNTX/actions/runs/35287688589'
          text=urllib.request.urlopen(url, timeout=30).read().decode()
          for line in text.splitlines():
              if any(word in line.lower() for word in ('not allowed','invalid workflow','upload-artifact','annotation','workflow error')):
                  print(re.sub('<[^>]+>', ' ', line)[:4000])
