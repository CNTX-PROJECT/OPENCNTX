name: Publication maintenance
on:
  push:
    branches: [maintenance/github-cleanup-20260918]
permissions:
  contents: read
  checks: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read workflow annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/CNTX-PROJECT/OPENCNTX/check-suites/95571763631/check-runs --jq '.check_runs[] | {id,output}'
          gh api repos/CNTX-PROJECT/OPENCNTX/actions/permissions/selected-actions || true
