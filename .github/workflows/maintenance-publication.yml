name: Finish publication maintenance source
on:
  push:
    branches: [maintenance/github-cleanup-20260918]
permissions:
  contents: read
jobs:
  finish:
    if: contains(github.event.head_commit.message, '[finish-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install existing quality tools
        run: python -m pip install --disable-pip-version-check -q -r requirements-quality.txt
      - name: Align navigation tests and preserve the published CLI basis
        shell: python {0}
        run: |
          from pathlib import Path
          import hashlib, json, os, re, subprocess, sys
          root=Path.cwd()
          changed=set()
          def edit(path, old, new):
              p=root/path
              value=p.read_text(encoding='utf-8')
              if old not in value:
                  raise RuntimeError('Expected replacement missing: '+path+' '+old[:100])
              p.write_text(value.replace(old,new),encoding='utf-8')
              changed.add(path)
          def write(path,value):
              (root/path).write_text(value,encoding='utf-8')
              changed.add(path)
          def method(path,name,body):
              p=root/path
              value=p.read_text()
              pattern=r'(?ms)^    def '+name+r'\(self\) -> None:\n.*?(?=^    def |\Z)'
              value,count=re.subn(pattern,lambda _:body+'\n\n',value,count=1)
              if count!=1:
                  raise RuntimeError('Missing test method '+name)
              write(path,value)
          edit('docs/faq.md','(roadmap-1.8.5.md)','(roadmap.md)')
          edit('README.md','Follow the [installation guide](docs/install-and-update.md).','[Get started](docs/start-here.md) with the [installation guide](docs/install-and-update.md).')
          edit('README.md','[Security](docs/security.md) · [Support](SUPPORT.md)','[Workspace](docs/workspace.md) · [Visual system](docs/visual-system.md) · [Security](docs/security.md) · [Support](SUPPORT.md)')
          edit('docs/README.md','## Main routes','The default route remains [Get started](start-here.md): initialize, preview, pack and verify.\n\n## Main routes')
          edit('docs/README.md','[Security policy](../SECURITY.md)','[Visual system](visual-system.md) · [Security policy](../SECURITY.md)')
          # Add the already released CLI command to the numbered executable reference.
          p='docs/commands.md'
          value=(root/p).read_text()
          rows=list(re.finditer(r'(?m)^\|\s*\d+\s*\|\s*`opencntx[^\n]+$',value))
          if len(rows)!=87:
              raise RuntimeError('Unexpected command table size')
          last=rows[-1]
          value=value[:last.end()]+'\n| 88 | `opencntx preview-search` | Search with optional compact JSON serialization. |'+value[last.end():]
          write(p,value)
          method('tests/test_quality.py','test_docs_index_links_every_guide','''    def test_docs_index_links_every_guide(self) -> None:
                  # Current navigation deliberately uses two levels rather than 65 entry links.
                  reached = {DOCS / "README.md"}
                  frontier = set(reached)
                  for _ in range(3):
                      next_pages = set()
                      for page in frontier:
                          for target in _local_links(page):
                              candidate = (page.parent / target).resolve()
                              if candidate.is_relative_to(DOCS) and candidate.suffix == ".md" and candidate.is_file():
                                  next_pages.add(candidate)
                      frontier = next_pages - reached
                      reached.update(next_pages)
                  self.assertTrue({DOCS / guide for guide in GUIDES}.issubset(reached))
                  for guide_name in GUIDES:
                      guide = DOCS / guide_name
                      headings = [line for line in guide.read_text(encoding="utf-8").splitlines() if line.startswith("# ")]
                      self.assertEqual(1, len(headings), guide_name)
                      self.assertIn("README.md", _local_links(guide), guide_name)
                  documented_paths = tuple(COMMAND_ROW.findall((DOCS / "commands.md").read_text(encoding="utf-8")))
                  executable_paths = _parser_leaf_command_paths(build_parser())
                  self.assertEqual(ORIENTATION_COMMAND_PATHS + executable_paths, documented_paths)
                  self.assertEqual(83, len(executable_paths))
                  self.assertEqual(88, len(documented_paths))''')
          method('tests/test_quality.py','test_one_start_page_and_fixed_primary_navigation','''    def test_one_start_page_and_fixed_primary_navigation(self) -> None:
                  self.assertTrue((DOCS / "start-here.md").is_file())
                  self.assertFalse((DOCS / "installation.md").exists())
                  self.assertFalse((DOCS / "getting-started.md").exists())
                  for markdown in (README, CHANGELOG, ROOT / "SUPPORT.md", *DOCS.glob("*.md")):
                      with self.subTest(markdown=markdown.relative_to(ROOT)):
                          text = markdown.read_text(encoding="utf-8")
                          self.assertNotIn("installation.md", text)
                          self.assertNotIn("getting-started.md", text)
                  # Each guide retains a visible route back, without enforcing seven duplicate links.
                  for guide_name in GUIDES:
                      with self.subTest(guide=guide_name):
                          header = "\\n".join((DOCS / guide_name).read_text(encoding="utf-8").splitlines()[:12])
                          self.assertIn("README.md)", header)
                  readme_links = set(_local_links(README))
                  self.assertTrue({"docs/start-here.md", "docs/README.md", "docs/roadmap.md", "docs/releases.md"}.issubset(readme_links))
                  index = (DOCS / "README.md").read_text(encoding="utf-8")
                  self.assertIn("The default route remains", index)
                  self.assertIn("path is the default route", (DOCS / "start-here.md").read_text(encoding="utf-8"))
                  self.assertLess(index.index("## Main routes"), index.index("## Optional project features"))''')
          # Validate the changed golden against the immutable published source, not the candidate.
          release='734ad894e20a34013f155ba8e7d3172cedd24c2e'
          refroot=Path(os.environ['RUNNER_TEMP'])/'published185'
          subprocess.run(['git','worktree','add','--detach',str(refroot),release],check=True,stdout=subprocess.DEVNULL)
          result=subprocess.run([sys.executable,'-m','opencntx','--help'],cwd=refroot,env={**os.environ,'PYTHONPATH':str(refroot/'src')},capture_output=True,check=True)
          expected='887da5589e8a59149b62aa045e91560d2c95a1a3b3848e9881251c3f870312e4'
          if hashlib.sha256(result.stdout).hexdigest()!=expected or result.stderr:
              raise RuntimeError('Published root help differs from the observed 1.8.5 basis')
          write('tests/fixtures/quality/cli-contract-1.8.5.json',json.dumps({'format':'opencntx-cli-contract-overlay-v1','basis_commit':release,'overrides':{'root-help':{'stdout_sha256':expected}}},indent=2)+'\n')
          edit('tests/test_refactor_contract.py','                "cli_knowledge.py",','                "cli_knowledge.py",\n                "cli_preview.py",')
          edit('tests/test_refactor_contract.py','        environment = os.environ.copy()','''        overlay = json.loads((FIXTURES / "cli-contract-1.8.5.json").read_text(encoding="utf-8"))
                  self.assertEqual("734ad894e20a34013f155ba8e7d3172cedd24c2e", overlay["basis_commit"])
                  self.assertEqual({"root-help"}, set(overlay["overrides"]))
                  for name, fields in overlay["overrides"].items():
                      self.assertEqual({"stdout_sha256"}, set(fields))
                      contract["cases"][name].update(fields)
                  environment = os.environ.copy()'''.replace('\n                  ','\n        ').replace('\n                      ','\n            '))
          # Fix explicit lint findings, retaining their assertions and matching behavior.
          p='tests/test_publication_maintenance.py'
          value=(root/p).read_text()
          value=re.sub(r'with patch\("publication_maintenance\._git", return_value=" M README.md"\):\n\s+with self.assertRaisesRegex\(ReleaseVersionError, "clean"\):\n\s+inspect_maintenance\(Path\("\."\)\)', 'with patch("publication_maintenance._git", return_value=" M README.md"), self.assertRaisesRegex(ReleaseVersionError, "clean"):\n            inspect_maintenance(Path("."))',value)
          write(p,value)
          p='tools/publication_links.py'
          value=(root/p).read_text()
          value=re.sub(r'elif parsed.fragment and target.suffix in \{".md", ".html"\}:\n\s+if unquote\(parsed.fragment\) not in anchors\(target.read_text\(encoding="utf-8"\)\):\n\s+errors.append\(([^\n]+)\)', 'elif (parsed.fragment and target.suffix in {".md", ".html"} and unquote(parsed.fragment) not in anchors(target.read_text(encoding="utf-8"))):\n                errors.append(\\1)',value)
          write(p,value)
          edit('tools/publication_maintenance.py','from release_version_gate import ReleaseVersionError, _git, _project_version','from release_version_gate import ReleaseVersionError, _git, _project_version, _stable_tags')
          edit('tools/publication_maintenance.py','    "tests/test_quality.py",','    "tests/test_quality.py",\n    "tests/test_refactor_contract.py",\n    "tests/fixtures/quality/cli-contract-1.8.5.json",')
          edit('tools/publication_maintenance.py','    tag = f"v{version}"','''    tags = _stable_tags(root)
              if not tags or str(max(tags)) != version:
                  raise ReleaseVersionError("maintenance version differs from the latest stable tag")
              tag = f"v{version}"'''.replace('\n              ','\n    ').replace('\n                  ','\n        '))
          edit('tools/release_version_gate.py','            result = inspect_maintenance(arguments.repository)','''            from publication_maintenance import ReleaseVersionError as MaintenanceError

                      try:
                          result = inspect_maintenance(arguments.repository)
                      except MaintenanceError as error:
                          raise ReleaseVersionError(str(error)) from error'''.replace('\n                      ','\n            ').replace('\n                          ','\n                '))
          # Historical records link fixed source rather than removed release listings.
          for path in (root/'docs').glob('*.md'):
              value=path.read_text(encoding='utf-8')
              previous=value
              value=value.replace('https://github.com/CNTX-PROJECT/OPENCNTX/releases/tag/v1.7.1','https://github.com/CNTX-PROJECT/OPENCNTX/tree/6b80cc41529653eac0b16b4238a4b7692eebb4f7')
              if value!=previous:
                  write(path.relative_to(root).as_posix(),value)
          python_files=sorted(p for p in changed if p.endswith('.py'))
          subprocess.run([sys.executable,'-m','ruff','check',*python_files,'--fix'],check=True)
          subprocess.run([sys.executable,'-m','ruff','format',*python_files],check=True)
          subprocess.run([sys.executable,'-m','compileall','-q',*python_files],check=True)
          subprocess.run(['git','config','user.name','OPENCNTX maintenance'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','commit','-m','maintenance: validate two-level documentation navigation and exact released CLI help'],check=True)
          subprocess.run(['gh','auth','setup-git'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/maintenance/github-cleanup-20260918'],check=True)
          print('SOURCE_HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
          # Concise real test results. No failed assertion is converted to a pass.
          import unittest, io, contextlib
          suite=unittest.TestSuite()
          for pattern in ['test_quality.py','test_public_roadmap.py','test_refactor_contract.py','test_visual_site.py','test_publication_*.py','test_release_version_gate.py']:
              suite.addTests(unittest.defaultTestLoader.discover('tests',pattern=pattern))
          log=io.StringIO()
          with contextlib.redirect_stdout(log), contextlib.redirect_stderr(log):
              outcome=unittest.TextTestRunner(stream=log,verbosity=0).run(suite)
          failures=[{'test':case.id(),'detail':detail[:1300] if len(detail)>2300 else detail} for case,detail in outcome.failures+outcome.errors]
          print('TARGETED_RESULTS',json.dumps({'tests':outcome.testsRun,'skipped':len(outcome.skipped),'failures':failures}),flush=True)
          check=subprocess.run([sys.executable,'tools/publication_links.py'],capture_output=True,text=True)
          print('LINK_RESULT',check.returncode,check.stdout[-5000:],check.stderr[-1000:],flush=True)
          raise SystemExit(0 if outcome.wasSuccessful() and check.returncode==0 else 1)
