name: Prepare publication cleanup
on:
  push:
    branches: [maintenance/github-cleanup-20260918]
permissions:
  contents: read
concurrency:
  group: opencntx-publication-maintenance
  cancel-in-progress: false
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[prepare-publication]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install existing development tools
        run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - name: Prepare and test the bounded maintenance change
        shell: bash
        run: |
          set -euo pipefail
          cp temporary_prepare_publication.py "$RUNNER_TEMP/prepare.py"
          python "$RUNNER_TEMP/prepare.py"
