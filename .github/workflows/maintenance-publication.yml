name: Prepare publication cleanup
on:
  push:
    branches: [maintenance/github-cleanup-20260918]
permissions:
  contents: read
concurrency:
  group: opencntx-publication-maintenance
  cancel-in-progress: false
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[prepare-publication]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install existing development tools
        run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - name: Prepare source; leave workflow ref updates to the authorized connector
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          program=Path('temporary_prepare_publication.py').read_text()
          insert='''import urllib.request
          ci_content=(ROOT/'.github/workflows/ci.yml').read_text()
          request=urllib.request.Request('https://api.github.com/repos/CNTX-PROJECT/OPENCNTX/git/blobs',data=json.dumps({'content':ci_content,'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=30) as response:
              ci_blob=json.load(response)['sha']
          print('WORKFLOW_HANDOFF_CI_BLOB',ci_blob,flush=True)
          command(['git','restore','--source',os.environ['GITHUB_SHA'],'--staged','--worktree','.github/workflows'])
          '''
          marker="# Commit to the same bounded branch, leaving normal PR checks to qualify it."
          if marker not in program:
              raise RuntimeError('Preparation commit boundary missing')
          program=program.replace(marker,insert+'\n'+marker)
          path=Path(os.environ['RUNNER_TEMP'])/'prepare.py'
          path.write_text(program)
          raise SystemExit(subprocess.call([sys.executable,str(path)]))
