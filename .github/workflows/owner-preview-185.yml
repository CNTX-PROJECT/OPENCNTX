name: OPENCNTX 1.8.5 owner preview

on:
  push:
    branches:
      - test/1.8.5-owner-preview

permissions:
  contents: read

concurrency:
  group: opencntx-owner-preview-185
  cancel-in-progress: false

jobs:
  publish-preview:
    if: contains(github.event.head_commit.message, '[publish-preview-185]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out the exact owner-authorized preview
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build==1.3.0 setuptools==83.0.0
      - name: Build and check the experimental package
        run: python tools/build_owner_preview_185.py
      - name: Publish a separate prerelease, never replace latest stable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create v1.8.5-preview.1
          dist/opencntx-1.8.5-py3-none-any.whl
          dist/opencntx-1.8.5.tar.gz
          dist/SHA256SUMS
          dist/BUILD-RECORD.json
          --target "$GITHUB_SHA"
          --title "OPENCNTX 1.8.5 — experimental owner preview 1"
          --notes-file docs/release-1.8.5-preview.md
          --prerelease
          --latest=false
