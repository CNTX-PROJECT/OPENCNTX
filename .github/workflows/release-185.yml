name: Publish OPENCNTX 1.8.5

on:
  push:
    branches:
      - release/1.8.5

permissions:
  contents: read

concurrency:
  group: opencntx-regular-release-185
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'CNTX-PROJECT/OPENCNTX' && contains(github.event.head_commit.message, '[publish-release-185]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out the exact owner-authorized release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check build==1.3.0 setuptools==83.0.0
      - name: Build and check the actual release artifacts
        run: python tools/build_release_185.py
      - name: Publish regular release and mark Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create v1.8.5
          dist/opencntx-1.8.5-py3-none-any.whl
          dist/opencntx-1.8.5.tar.gz
          dist/SHA256SUMS
          dist/BUILD-RECORD.json
          --target "$GITHUB_SHA"
          --title "OPENCNTX 1.8.5"
          --notes-file docs/release-1.8.5.md
          --prerelease=false
          --latest=true
      - name: Read back publication and verify downloaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v1.8.5" --jq '{tag: .tag_name, draft: .draft, prerelease: .prerelease, target: .target_commitish, assets: [.assets[].name]}'
          test "$(gh api "repos/$GH_REPO/releases/tags/v1.8.5" --jq '.draft')" = false
          test "$(gh api "repos/$GH_REPO/releases/tags/v1.8.5" --jq '.prerelease')" = false
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = v1.8.5
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v1.8.5" --jq '.object.sha')" = "$GITHUB_SHA"
          downloaded="$(mktemp -d)"
          gh release download v1.8.5 --dir "$downloaded" --pattern 'opencntx-1.8.5-py3-none-any.whl' --pattern 'opencntx-1.8.5.tar.gz' --pattern 'SHA256SUMS' --pattern 'BUILD-RECORD.json'
          for name in opencntx-1.8.5-py3-none-any.whl opencntx-1.8.5.tar.gz SHA256SUMS BUILD-RECORD.json; do
            cmp "dist/$name" "$downloaded/$name"
          done
          (cd "$downloaded" && sha256sum --check SHA256SUMS)
