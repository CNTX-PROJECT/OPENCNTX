name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned build toolchain
        run: python -m pip install --disable-pip-version-check build==1.3.0 setuptools==83.0.0

      - name: Install pinned quality toolchain on Python 3.13
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-quality.txt
          python -m pip install --disable-pip-version-check -r requirements-security.txt

      - name: Audit pinned build and quality dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pip_audit --version
          python -m pip_audit -r requirements-quality.txt --format json --output "${RUNNER_TEMP}/opencntx-pip-audit.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "opencntx-pip-audit.json"
          content = path.read_bytes()
          result = json.loads(content)
          dependencies = result.get("dependencies")
          if not isinstance(dependencies, list):
              raise SystemExit("pip-audit JSON has no dependency inventory")
          vulnerabilities = sum(len(item.get("vulns", [])) for item in dependencies)
          if vulnerabilities:
              raise SystemExit(f"pip-audit reported {vulnerabilities} vulnerabilities")
          print(
              "PIP_AUDIT_OK "
              f"dependencies={len(dependencies)} vulnerabilities=0 "
              f"sha256={hashlib.sha256(content).hexdigest()}"
          )
          PY

      - name: Prepare bounded offline build inputs
        shell: python {0}
        run: |
          import os
          import pathlib
          import subprocess
          import sys

          wheelhouse = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opencntx-wheelhouse"
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "download",
                  "--disable-pip-version-check",
                  "--dest",
                  str(wheelhouse),
                  "build==1.3.0",
                  "setuptools==83.0.0",
              ],
              check=True,
          )
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write("PIP_NO_INDEX=1\n")
              environment.write(f"PIP_FIND_LINKS={wheelhouse}\n")

      - name: Verify installed development tools
        run: python -m pip check

      - name: Verify package version against latest stable tag
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python tools/release_version_gate.py --repository .

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: Run tests, properties, and branch coverage
        if: matrix.python-version == '3.13'
        env:
          COVERAGE_FILE: ${{ runner.temp }}/opencntx-coverage-data
        run: |
          python -W error::ResourceWarning -m coverage run --branch --source=opencntx -m unittest discover -s tests
          python -m coverage json -o "${{ runner.temp }}/opencntx-coverage.json"
          python tools/quality_gate.py metrics
          python tools/quality_gate.py coverage "${{ runner.temp }}/opencntx-coverage.json"

      - name: Run platform-independent static quality gates
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python tools/quality_gate.py lint
          python tools/quality_gate.py types
          python tools/render_visual_tokens.py --check
          python tools/visual_quality_gate.py

      - name: Build twice and verify unpublished candidates
        shell: python {0}
        run: |
          import os
          import subprocess
          import sys

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          if commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("checked-out commit differs from GITHUB_SHA")
          subprocess.run(
              [
                  sys.executable,
                  "tools/release_artifacts.py",
                  "build",
                  "--repository",
                  ".",
                  "--output",
                  "dist",
                  "--expected-commit",
                  commit,
                  "--expected-tree",
                  tree,
              ],
              check=True,
          )

      - name: Install, smoke, and uninstall wheel and sdist
        shell: python {0}
        run: |
          import pathlib
          import subprocess
          import sys
          import tomllib

          with pathlib.Path("pyproject.toml").open("rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]
          artifacts = [
              *sorted(pathlib.Path("dist").glob("opencntx-*.whl")),
              *sorted(pathlib.Path("dist").glob("opencntx-*.tar.gz")),
          ]
          if len(artifacts) != 2:
              raise SystemExit(f"expected wheel and sdist, found {artifacts}")
          for artifact in artifacts:
              subprocess.run(
                  [
                      sys.executable,
                      "tools/release_artifacts.py",
                      "smoke",
                      "--artifact",
                      str(artifact),
                      "--expected-version",
                      version,
                  ],
                  check=True,
              )

      - name: Run bounded contention, crash, and v0.3.0 upgrade proofs
        if: matrix.python-version == '3.14'
        shell: python {0}
        run: |
          import os
          import pathlib
          import subprocess
          import sys

          wheels = sorted(pathlib.Path("dist").glob("opencntx-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one candidate wheel, found {wheels}")
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opencntx-r8-23-hardening"
          subprocess.run(
              [
                  sys.executable,
                  "tools/r8_hardening.py",
                  "platform",
                  "--candidate",
                  str(wheels[0]),
                  "--evidence",
                  str(evidence),
              ],
              check=True,
          )
