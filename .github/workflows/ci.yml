name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy:
    name: Legacy ${{ matrix.legacy.name }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        legacy:
          - name: 1.1.0
            commit: 833f54c87c605b4eaa77efd2574db11f88bbd41c
          - name: 1.1.1
            commit: df4e79e48254fad62c940a6d9386805819c527ab
          - name: 1.2.0
            commit: 8e4f4c2da96fd5c4c21bb3b9f44e5cbdc94207ea
          - name: 1.2.1
            commit: 4d23346f2afdf70a8e50eabef64d1d6f2b7de23a
          - name: 1.3.0
            commit: 84620975261afd78a2821b8cad29165d921b5b12
          - name: 1.4.0
            commit: 97296944189add8892753feb33dedd135efc0462
          - name: 1.5.0
            commit: a670af45676ec977103e8d1c575d0998f5683785
          - name: 1.6.0
            commit: 78ad80017c35cf430d67537486cd254449a44c6d
          - name: 1.6.1
            commit: db6ee76ae247ebe90c56e7593bdefd7797804f41
          - name: 1.6.2-candidate
            commit: 01c34fc5aab556a2e5e0447af2a83bbb46f48ef1
          - name: 1.6.3
            commit: 20731daca41216d341240092321146aa0c58f1f0
          - name: 1.7.0
            commit: 654c110b59c7df33bdb223c163c5783c79848c30
          - name: 1.7.1
            commit: 6b80cc41529653eac0b16b4238a4b7692eebb4f7
          - name: 1.7.3
            commit: 7d861240c784a1b4a947c24db8e0ce58e805c618
          - name: 1.7.4
            commit: 79853c6500328e11bf2164b82f5dd4f26c1694bb
          - name: 1.7.5
            commit: 685d3738782c1e0ef2ebc7398d1f76593fae54b8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONPATH: src
      LEGACY_COMMIT: ${{ matrix.legacy.commit }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require historical writer tests without skips
        shell: python {0}
        run: |
          import os
          import pathlib
          import subprocess
          import sys

          source = pathlib.Path(os.environ["RUNNER_TEMP"]) / "legacy-source"
          commit = os.environ["LEGACY_COMMIT"]
          subprocess.run(["git", "worktree", "add", "--detach", str(source), commit], check=True)
          subprocess.run([
              sys.executable, "tools/legacy_compatibility.py",
              "--source", str(source), "--expected-commit", commit,
          ], check=True)

  managed-install:
    name: Upgrade ${{ matrix.baseline-version }} / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        baseline-version: ["1.7.6"]
        include:
          - {os: ubuntu-latest, python-version: "3.12", baseline-version: "1.8.0"}
          - {os: windows-latest, python-version: "3.12", baseline-version: "1.8.0"}
          - {os: ubuntu-latest, python-version: "3.12", baseline-version: "1.8.1"}
          - {os: windows-latest, python-version: "3.12", baseline-version: "1.8.1"}
          - {os: ubuntu-latest, python-version: "3.12", baseline-version: "1.8.2"}
          - {os: windows-latest, python-version: "3.12", baseline-version: "1.8.2"}
          - {os: ubuntu-latest, python-version: "3.12", baseline-version: "1.8.3"}
          - {os: windows-latest, python-version: "3.12", baseline-version: "1.8.3"}
          - {os: ubuntu-latest, python-version: "3.12", baseline-version: "1.8.4"}
          - {os: windows-latest, python-version: "3.12", baseline-version: "1.8.4"}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONPATH: src
      BASELINE_VERSION: ${{ matrix.baseline-version }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned build toolchain
        run: python -m pip install --disable-pip-version-check build==1.3.0 setuptools==83.0.0
      - name: Build exact candidate and acquire the explicitly identified baseline
        shell: python {0}
        run: |
          import hashlib
          import os
          import pathlib
          import subprocess
          import sys
          import urllib.request

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          subprocess.run([
              sys.executable, "tools/release_artifacts.py", "build",
              "--repository", ".", "--output", "dist",
              "--expected-commit", commit, "--expected-tree", tree,
          ], check=True)
          version = os.environ["BASELINE_VERSION"]
          hashes = {
              "1.7.6": "b27d08f9851b9a8f1a30cb7fc71c3e94eedb579141cdce3609424b753071785f",
              "1.8.0": "6dfd5bc701db86da3dafc406869d795e00ae1e926358fb03224565650055fa72",
              "1.8.1": "c23a1bb694dd8d8d7ee65c56c9d43f03c9ebcfa26daaeab2bf2563a227f76a7d",
              "1.8.2": "527de5197a231365bbf55dc36fe407956548f963f5dbd34fa4f54e3c2e226554",
              "1.8.3": "ae65a2885250c140c142b9d9a21521a91248c9128f7d9967d7ff44ec92b1005f",
              "1.8.4": "b3fe658c5071b17e1835be65cc10df3c025dd03677c1be45c9b8aeb977d011d9",
          }
          baseline = pathlib.Path(f"dist/opencntx-{version}-py3-none-any.whl")
          if version == "1.7.6":
              import json
              fixture_root = pathlib.Path("tests/fixtures/release-baselines")
              manifest = json.loads((fixture_root / "manifest.json").read_text())
              fixture = next(item for item in manifest["baselines"] if item["version"] == version)
              if fixture["kind"] != "SOURCE_REBUILT_NOT_ORIGINAL":
                  raise SystemExit("Missing rebuilt-baseline provenance")
              hashes[version] = fixture["sha256"]
              baseline.write_bytes((fixture_root / fixture["file"]).read_bytes())
              print("BASELINE_KIND=SOURCE_REBUILT_NOT_ORIGINAL", fixture["sha256"])
          else:
              urllib.request.urlretrieve(
                  f"https://github.com/CNTX-PROJECT/OPENCNTX/releases/download/v{version}/"
                  f"opencntx-{version}-py3-none-any.whl",
                  baseline,
              )
          if hashlib.sha256(baseline.read_bytes()).hexdigest() != hashes[version]:
              raise SystemExit("Baseline wheel differs from frozen published bytes")
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"BASELINE_SHA256={hashes[version]}\n")
      - name: Require update, rollback, reapply, resume, and cleanup
        run: >-
          python tools/managed_install_acceptance.py
          --candidate dist/opencntx-1.8.5-py3-none-any.whl
          --baseline dist/opencntx-${{ matrix.baseline-version }}-py3-none-any.whl
          --expected-candidate 1.8.5
          --expected-baseline ${{ matrix.baseline-version }}
          --expected-baseline-sha256 ${{ env.BASELINE_SHA256 }}
      - name: Preserve existing projects through update and failed activation
        if: matrix.python-version == '3.12'
        run: >-
          python tests/r12_install_simulator.py
          --candidate dist/opencntx-1.8.5-py3-none-any.whl
          --baseline dist/opencntx-${{ matrix.baseline-version }}-py3-none-any.whl
          --cycles 4

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned build toolchain
        run: python -m pip install --disable-pip-version-check build==1.3.0 setuptools==83.0.0

      - name: Install pinned quality toolchain on Python 3.13
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-quality.txt
          python -m pip install --disable-pip-version-check -r requirements-security.txt

      - name: Audit pinned build and quality dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pip_audit --version
          python -m pip_audit -r requirements-quality.txt --format json --output "${RUNNER_TEMP}/opencntx-pip-audit.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "opencntx-pip-audit.json"
          content = path.read_bytes()
          result = json.loads(content)
          dependencies = result.get("dependencies")
          if not isinstance(dependencies, list):
              raise SystemExit("pip-audit JSON has no dependency inventory")
          vulnerabilities = sum(len(item.get("vulns", [])) for item in dependencies)
          if vulnerabilities:
              raise SystemExit(f"pip-audit reported {vulnerabilities} vulnerabilities")
          print(
              "PIP_AUDIT_OK "
              f"dependencies={len(dependencies)} vulnerabilities=0 "
              f"sha256={hashlib.sha256(content).hexdigest()}"
          )
          PY

      - name: Prepare bounded offline build inputs
        shell: python {0}
        run: |
          import os
          import pathlib
          import subprocess
          import sys

          wheelhouse = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opencntx-wheelhouse"
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "download",
                  "--disable-pip-version-check",
                  "--dest",
                  str(wheelhouse),
                  "build==1.3.0",
                  "setuptools==83.0.0",
              ],
              check=True,
          )
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write("PIP_NO_INDEX=1\n")
              environment.write(f"PIP_FIND_LINKS={wheelhouse}\n")

      - name: Verify installed development tools
        run: python -m pip check

      - name: Verify package version against latest stable tag
        if: >-
          matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' &&
          github.event_name != 'pull_request'
        run: python tools/release_version_gate.py --repository . --maintenance

      - name: Verify public navigation and baseline fixture hashes
        run: python tools/publication_links.py

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: Run tests, properties, and branch coverage
        if: matrix.python-version == '3.13'
        env:
          COVERAGE_FILE: ${{ runner.temp }}/opencntx-coverage-data
        run: |
          python -W error::ResourceWarning -m coverage run --branch --source=opencntx -m unittest discover -s tests
          python -m coverage json -o "${{ runner.temp }}/opencntx-coverage.json"
          python tools/quality_gate.py metrics
          python tools/quality_gate.py coverage "${{ runner.temp }}/opencntx-coverage.json"

      - name: Run platform-independent static quality gates
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python tools/quality_gate.py lint
          python tools/quality_gate.py types
          python tools/quality_gate.py language
          python tools/render_visual_tokens.py --check
          python tools/visual_quality_gate.py
          python tools/release_176_efficiency.py --output "${RUNNER_TEMP}/release-176-efficiency.json"

      - name: Build twice and verify unpublished candidates
        shell: python {0}
        run: |
          import os
          import subprocess
          import sys

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          if commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("checked-out commit differs from GITHUB_SHA")
          subprocess.run(
              [
                  sys.executable,
                  "tools/release_artifacts.py",
                  "build",
                  "--repository",
                  ".",
                  "--output",
                  "dist",
                  "--expected-commit",
                  commit,
                  "--expected-tree",
                  tree,
              ],
              check=True,
          )

      - name: Install, smoke, and uninstall wheel and sdist
        shell: python {0}
        run: |
          import pathlib
          import subprocess
          import sys
          import tomllib

          with pathlib.Path("pyproject.toml").open("rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]
          artifacts = [
              *sorted(pathlib.Path("dist").glob("opencntx-*.whl")),
              *sorted(pathlib.Path("dist").glob("opencntx-*.tar.gz")),
          ]
          if len(artifacts) != 2:
              raise SystemExit(f"expected wheel and sdist, found {artifacts}")
          for artifact in artifacts:
              subprocess.run(
                  [
                      sys.executable,
                      "tools/release_artifacts.py",
                      "smoke",
                      "--artifact",
                      str(artifact),
                      "--expected-version",
                      version,
                  ],
                  check=True,
              )

      - name: Run bounded contention, crash, and v0.3.0 upgrade proofs
        if: matrix.python-version == '3.14'
        shell: python {0}
        run: |
          import os
          import pathlib
          import subprocess
          import sys

          wheels = sorted(pathlib.Path("dist").glob("opencntx-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one candidate wheel, found {wheels}")
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opencntx-r8-23-hardening"
          subprocess.run(
              [
                  sys.executable,
                  "tools/r8_hardening.py",
                  "platform",
                  "--candidate",
                  str(wheels[0]),
                  "--evidence",
                  str(evidence),
              ],
              check=True,
          )
