<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">OPENCNTX symbol for light screens</title>
  <desc id="description">Two offset context brackets form a precise white and Plum portal on a deep-navy rounded tile.</desc>
  <g id="avatar-tile" aria-label="Deep-navy symbol tile" fill="#0B1020">
    <rect x="56" y="24" width="144" height="208"/><rect x="24" y="56" width="208" height="144"/>
    <circle cx="56" cy="56" r="32"/><circle cx="200" cy="56" r="32"/><circle cx="56" cy="200" r="32"/><circle cx="200" cy="200" r="32"/>
  </g>
  <g id="context-primary" aria-label="Open context bracket" fill="#FFFFFF">
    <rect x="66" y="66" width="17" height="124"/><rect x="66" y="66" width="77" height="17"/><rect x="66" y="173" width="77" height="17"/>
  </g>
  <g id="context-accent" aria-label="Verified context bracket" fill="#DDA0DD">
    <rect x="173" y="91" width="17" height="74"/><rect x="113" y="91" width="77" height="17"/><rect x="113" y="148" width="77" height="17"/>
  </g>
  <rect id="evidence-node" x="119" y="119" width="18" height="18" fill="#FFFFFF"/>
</svg>
