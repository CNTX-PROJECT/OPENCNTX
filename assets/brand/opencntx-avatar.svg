<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">OPENCNTX avatar</title>
  <desc id="description">Two offset context brackets form a precise white and Plum portal on a deep-navy rounded tile.</desc>
  <g id="avatar-tile" aria-label="Deep-navy avatar tile" fill="#0B1020">
    <rect x="112" y="48" width="288" height="416"/>
    <rect x="48" y="112" width="416" height="288"/>
    <circle cx="112" cy="112" r="64"/><circle cx="400" cy="112" r="64"/>
    <circle cx="112" cy="400" r="64"/><circle cx="400" cy="400" r="64"/>
  </g>
  <g id="context-primary" aria-label="Open context bracket" fill="#FFFFFF">
    <rect x="132" y="132" width="34" height="248"/><rect x="132" y="132" width="154" height="34"/><rect x="132" y="346" width="154" height="34"/>
  </g>
  <g id="context-accent" aria-label="Verified context bracket" fill="#DDA0DD">
    <rect x="346" y="182" width="34" height="148"/><rect x="226" y="182" width="154" height="34"/><rect x="226" y="296" width="154" height="34"/>
  </g>
  <rect id="evidence-node" x="239" y="239" width="34" height="34" fill="#FFFFFF"/>
</svg>
