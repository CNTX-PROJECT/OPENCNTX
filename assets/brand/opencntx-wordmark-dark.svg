<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" role="img" aria-labelledby="title description">
  <title id="title">OPENCNTX wordmark for dark screens</title>
  <desc id="description">Centered lowercase OPENCNTX wordmark with a white and Plum portal on deep navy and one continuous rounded letter rhythm.</desc>
  <rect x="0" y="0" width="800" height="160" fill="#0B1020"/>
  <g id="avatar-tile" aria-label="OPENCNTX portal symbol" fill="#171E32">
    <rect x="152" y="20" width="78" height="120"/><rect x="132" y="40" width="118" height="80"/>
    <circle cx="152" cy="40" r="20"/><circle cx="230" cy="40" r="20"/><circle cx="152" cy="120" r="20"/><circle cx="230" cy="120" r="20"/>
  </g>
  <g id="context-primary" fill="#FFFFFF">
    <rect x="154" y="52" width="8" height="56"/><rect x="154" y="52" width="35" height="8"/><rect x="154" y="100" width="35" height="8"/>
  </g>
  <g id="context-accent" fill="#DDA0DD">
    <rect x="220" y="64" width="8" height="32"/><rect x="191" y="64" width="37" height="8"/><rect x="191" y="88" width="37" height="8"/>
  </g>
  <rect x="187" y="76" width="9" height="9" fill="#FFFFFF"/>
  <g id="wordmark" aria-label="OPENCNTX">
    <text x="286" y="113" font-family="Trebuchet MS, Trebuchet, Arial, sans-serif" font-size="90" font-weight="700" letter-spacing="-0.015em" textLength="382" lengthAdjust="spacing"><tspan fill="#FFFFFF">open</tspan><tspan fill="#DDA0DD">cntx</tspan></text>
  </g>
</svg>
