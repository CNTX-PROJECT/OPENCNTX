<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="516" viewBox="0 0 1200 516" role="img" aria-labelledby="title desc">
  <title id="title">Local security boundary</title>
  <desc id="desc">Local files stay inside the OPENCNTX boundary until the user separately chooses to share reviewed output with an external tool.</desc>
  <rect width="1200" height="516" fill="#F8FAFC"/>
  <rect x="60" y="42" width="156" height="32" rx="16" fill="#0B1020"/>
  <text x="138.0" y="64" text-anchor="middle" fill="#DDA0DD" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="750" letter-spacing="1.6">PRIVACY BOUNDARY</text>
  <text x="60" y="124" text-anchor="start" fill="#0F172A" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="750" letter-spacing="-1.1">Local until you choose to share</text>
  <text x="60" y="158" text-anchor="start" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="450">OPENCNTX does not upload your files; the final transfer remains your decision.</text>
  <rect x="44" y="202" width="742" height="264" rx="28" fill="none" stroke="#DDA0DD" stroke-width="2" stroke-dasharray="10 10"/>
  <rect x="68" y="186" width="164" height="32" rx="16" fill="#0B1020"/>
  <text x="150" y="208" text-anchor="middle" fill="#DDA0DD" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="780" letter-spacing="1.4">LOCAL BOUNDARY</text>
  <rect x="76" y="242" width="310" height="204" rx="20" fill="#F1F5F9"/>
  <rect id="card-local-files" x="72" y="234" width="310" height="204" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="72" y="234" width="310" height="6" rx="3" fill="#DDA0DD"/>
  <circle cx="227.0" cy="288" r="22" fill="#0B1020"/>
  <text x="227.0" y="295" text-anchor="middle" fill="#DDA0DD" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800">01</text>
  <text x="227.0" y="342" text-anchor="middle" fill="#0F172A" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="720" letter-spacing="-0.4">LOCAL FILES</text>
  <text x="227.0" y="384" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">You select the input</text>
  <text x="227.0" y="414" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">Nothing is uploaded</text>
  <rect x="430" y="242" width="310" height="204" rx="20" fill="#F1F5F9"/>
  <rect id="card-opencntx" x="426" y="234" width="310" height="204" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="426" y="234" width="310" height="6" rx="3" fill="#0891B2"/>
  <circle cx="581.0" cy="288" r="22" fill="#CFFAFE"/>
  <text x="581.0" y="295" text-anchor="middle" fill="#0891B2" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800">02</text>
  <text x="581.0" y="342" text-anchor="middle" fill="#0F172A" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="720" letter-spacing="-0.4">OPENCNTX</text>
  <text x="581.0" y="384" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">Builds and verifies locally</text>
  <text x="581.0" y="414" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">You inspect the output</text>
  <line x1="389" y1="336" x2="409" y2="336" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <polyline points="401,328 409,336 401,344" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="850" y="242" width="294" height="204" rx="20" fill="#F1F5F9"/>
  <rect id="card-external" x="846" y="234" width="294" height="204" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="846" y="234" width="294" height="6" rx="3" fill="#047857"/>
  <circle cx="993.0" cy="288" r="22" fill="#D1FAE5"/>
  <text x="993.0" y="295" text-anchor="middle" fill="#047857" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800">03</text>
  <text x="993.0" y="342" text-anchor="middle" fill="#0F172A" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="720" letter-spacing="-0.4">EXTERNAL TOOL</text>
  <text x="993.0" y="384" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">Receives only what you send</text>
  <text x="993.0" y="414" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">Outside OPENCNTX control</text>
  <line x1="786" y1="336" x2="829" y2="336" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <polyline points="821,328 829,336 821,344" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="757" y="370" width="112" height="28" rx="14" fill="#D1FAE5"/>
  <text x="813" y="390" text-anchor="middle" fill="#047857" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800" letter-spacing="1.0">YOUR DECISION</text>
</svg>
