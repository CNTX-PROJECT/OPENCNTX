<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Completed OPENCNTX roadmap for dark screens</title>
  <desc id="desc">Four equal milestones show the runnable core, version 0.1, workspace foundation, and the version 1.0.0 Production/Stable line.</desc>
  <rect width="1200" height="450" fill="#0D1117"/>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Completed public milestones</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="150" width="240" height="240" rx="24" fill="#17131F" stroke="#C084FC" stroke-width="4"/>
    <rect x="340" y="150" width="240" height="240" rx="24" fill="#17131F" stroke="#C084FC" stroke-width="4"/>
    <rect x="620" y="150" width="240" height="240" rx="24" fill="#17131F" stroke="#C084FC" stroke-width="4"/>
    <rect x="900" y="150" width="240" height="240" rx="24" fill="#17131F" stroke="#C084FC" stroke-width="4"/>
    <text x="180" y="218" text-anchor="middle" font-size="27" font-weight="700" fill="#C084FC">CORE</text>
    <text x="180" y="270" text-anchor="middle" font-size="20" fill="#FFFFFF">init · pack · verify</text>
    <text x="460" y="218" text-anchor="middle" font-size="27" font-weight="700" fill="#C084FC">v0.1.0</text>
    <text x="460" y="270" text-anchor="middle" font-size="20" fill="#FFFFFF">Public core release</text>
    <text x="740" y="218" text-anchor="middle" font-size="27" font-weight="700" fill="#C084FC">WORKSPACE</text>
    <text x="740" y="270" text-anchor="middle" font-size="20" fill="#FFFFFF">Bounded project flow</text>
    <text x="1020" y="218" text-anchor="middle" font-size="27" font-weight="700" fill="#C084FC">v1.0.0</text>
    <text x="1020" y="270" text-anchor="middle" font-size="20" fill="#FFFFFF">Production/Stable line</text>
  </g>
  <g stroke="#C084FC" stroke-width="6" fill="#C084FC">
    <line x1="306" y1="320" x2="322" y2="320"/><polygon points="322,308 340,320 322,332"/>
    <line x1="586" y1="320" x2="602" y2="320"/><polygon points="602,308 620,320 602,332"/>
    <line x1="866" y1="320" x2="882" y2="320"/><polygon points="882,308 900,320 882,332"/>
  </g>
</svg>
