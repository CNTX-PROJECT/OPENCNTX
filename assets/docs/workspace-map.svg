<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="626" viewBox="0 0 1200 626" role="img" aria-labelledby="title desc">
  <title id="title">Stable workspace map</title>
  <desc id="desc">Four areas organize control, captured sources, reviewed knowledge, and bounded work inside one stable optional workspace.</desc>
  <rect x="60" y="42" width="172" height="32" rx="16" fill="#0B1020"/>
  <text x="146.0" y="64" text-anchor="middle" fill="#DDA0DD" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="750" letter-spacing="1.6">OPTIONAL WORKSPACE</text>
  <text x="60" y="124" text-anchor="start" fill="#0F172A" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="750" letter-spacing="-1.1">Stable workspace for longer projects</text>
  <text x="60" y="158" text-anchor="start" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="450">Four clearly separated areas keep authority, evidence, knowledge, and work understandable.</text>
  <rect x="64" y="226" width="520" height="162" rx="20" fill="#F1F5F9"/>
  <rect id="card-control" x="60" y="218" width="520" height="162" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="60" y="218" width="520" height="6" rx="3" fill="#DDA0DD"/>
  <circle cx="320.0" cy="272" r="22" fill="#0B1020"/>
  <text x="320.0" y="279" text-anchor="middle" fill="#DDA0DD" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800">01</text>
  <text x="320.0" y="326" text-anchor="middle" fill="#0F172A" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="720" letter-spacing="-0.4">CONTROL</text>
  <text x="320.0" y="368" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">OWNER, ROADMAP, CURRENT</text>
  <rect x="624" y="226" width="520" height="162" rx="20" fill="#F1F5F9"/>
  <rect id="card-sources" x="620" y="218" width="520" height="162" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="620" y="218" width="520" height="6" rx="3" fill="#0891B2"/>
  <circle cx="880.0" cy="272" r="22" fill="#CFFAFE"/>
  <text x="880.0" y="279" text-anchor="middle" fill="#0891B2" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800">02</text>
  <text x="880.0" y="326" text-anchor="middle" fill="#0F172A" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="720" letter-spacing="-0.4">SOURCES</text>
  <text x="880.0" y="368" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">Exact supplied bytes and receipts</text>
  <rect x="64" y="422" width="520" height="162" rx="20" fill="#F1F5F9"/>
  <rect id="card-knowledge" x="60" y="414" width="520" height="162" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="60" y="414" width="520" height="6" rx="3" fill="#B45309"/>
  <circle cx="320.0" cy="468" r="22" fill="#FEF3C7"/>
  <text x="320.0" y="475" text-anchor="middle" fill="#B45309" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800">03</text>
  <text x="320.0" y="522" text-anchor="middle" fill="#0F172A" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="720" letter-spacing="-0.4">KNOWLEDGE</text>
  <text x="320.0" y="564" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">Chapters, catalog, derived text</text>
  <rect x="624" y="422" width="520" height="162" rx="20" fill="#F1F5F9"/>
  <rect id="card-work" x="620" y="414" width="520" height="162" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="620" y="414" width="520" height="6" rx="3" fill="#047857"/>
  <circle cx="880.0" cy="468" r="22" fill="#D1FAE5"/>
  <text x="880.0" y="475" text-anchor="middle" fill="#047857" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800">04</text>
  <text x="880.0" y="522" text-anchor="middle" fill="#0F172A" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="720" letter-spacing="-0.4">BOUNDED WORK</text>
  <text x="880.0" y="564" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="450">Tasks, playbooks, roles, results</text>
  <line x1="580" y1="299" x2="600" y2="299" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="590" y1="289" x2="590" y2="496" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="580" y1="496" x2="600" y2="496" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="590" cy="397" r="6" fill="#DDA0DD"/>
</svg>
